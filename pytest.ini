[pytest]
# Archived runs and seeded application suites are evidence/fixtures, not harness tests.
# The staged public application suite is exercised by visibility/tests/test_build.py.
norecursedirs = .* archives host_only mosslight templates external-honeypot-scaffold-main
markers =
    docker: requires the local Docker daemon and docker.io/library/mosslight-tools:local image
